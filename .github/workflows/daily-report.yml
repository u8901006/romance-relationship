name: Romance Relationship Daily Report

on:
  schedule:
    - cron: "30 12 * * *" # UTC 12:30 = 台北時間 20:30
  workflow_dispatch:
    inputs:
      date:
        description: "Target date (YYYY-MM-DD), leave empty for today"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Determine date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "target=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            TARGET=$(TZ=Asia/Taipei date +%Y-%m-%d)
            echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          fi
          echo "Date: $(grep target "$GITHUB_OUTPUT" | cut -d= -f2)"

      - name: Fetch papers from PubMed
        run: |
          node scripts/fetch_papers.js \
            --days 7 \
            --max-papers 40 \
            --output papers.json
        continue-on-error: true

      - name: Check papers data
        id: papers
        run: |
          if [ -f papers.json ] && grep -q '"count"' papers.json; then
            COUNT=$(node -e "const d=require('./papers.json'); console.log(d.count||0)")
            echo "count=$COUNT" >> "$GITHUB_OUTPUT"
            echo "Papers found: $COUNT"
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo '{"date":"${{ steps.date.outputs.target }}","count":0,"papers":[]}' > papers.json
            echo "No papers found, will generate empty report"
          fi

      - name: Configure NVIDIA Nemotron backend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("scripts/generate_report.js")
          s = p.read_text(encoding="utf-8")
          s = s.replace("https://open.bigmodel.cn/api/coding/paas/v4", "https://integrate.api.nvidia.com/v1")
          for old, new in [
              ("GLM-5-Turbo", "nvidia/nemotron-3-super-120b-a12b"),
              ("glm-5-turbo", "nvidia/nemotron-3-super-120b-a12b"),
              ("GLM-4.7-Flash", "nvidia/nemotron-3-nano-30b-a3b"),
              ("glm-4.7-flash", "nvidia/nemotron-3-nano-30b-a3b"),
              ("GLM-4.7", "nvidia/nemotron-3-nano-30b-a3b"),
              ("glm-4.7", "nvidia/nemotron-3-nano-30b-a3b"),
              ("ZHIPU_API_KEY", "NVIDIA_API_KEY"),
              ("ZHIPU_API_BASE", "NVIDIA_API_BASE"),
          ]:
              s = s.replace(old, new)
          s = re.sub(r"max_tokens:\s*[0-9_]+,", "max_tokens: 16384,", s)
          s = s.replace("temperature: 0.3", "temperature: 1.0")
          s = s.replace("top_p: 0.9", "top_p: 0.95")
          marker = "max_tokens: 16384,"
          if marker in s and "chat_template_kwargs" not in s:
              s = s.replace(marker, marker + "\n          chat_template_kwargs: { enable_thinking: false },", 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Generate report with NVIDIA Nemotron
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          test -n "$NVIDIA_API_KEY" || { echo "::error::Missing NVIDIA_API_KEY repository secret"; exit 1; }
          node scripts/generate_report.js \
            --input papers.json \
            --output docs/romance-${{ steps.date.outputs.target }}.html
        timeout-minutes: 18

      - name: Save papers JSON for dedup
        run: |
          cp papers.json docs/romance-${{ steps.date.outputs.target }}.json

      - name: Generate index page
        run: node scripts/generate_index.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "📄 romance relationship daily report: ${{ steps.date.outputs.target }}"
          git pull --rebase origin main
          git push

      - name: Summary
        if: always()
        run: |
          echo "### 📄 Romance Relationship Daily Report" >> "$GITHUB_STEP_SUMMARY"
          echo "**Date:** ${{ steps.date.outputs.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Papers analyzed:** ${{ steps.papers.outputs.count || '0' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Report:** [romance-${{ steps.date.outputs.target }}.html](https://u8901006.github.io/romance-relationship/romance-${{ steps.date.outputs.target }}.html)" >> "$GITHUB_STEP_SUMMARY"
